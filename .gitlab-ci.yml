# .gitlab-ci.yml — Pipeline de CI/CD para Lockd
stages:
  - lint
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 lockd/ lockd.py --count --statistics
  allow_failure: false

.test_template: &test_template
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3-gi gir1.2-gtk-4.0 libgirepository1.0-dev python3-yaml shellcheck
    - pip install pyyaml pytest --quiet
  script:
    - echo "=== Python $PYTHON_VERSION ==="
    - python --version
    - python -c "import yaml; print('PyYAML OK')"
    - python -m py_compile lockd.py
    - python -m py_compile lockd/engine/distro_detector.py
    - python -m py_compile lockd/engine/scanner.py
    - python -m py_compile lockd/engine/module_loader.py
    - python -m py_compile lockd/app/controller.py
    - python ci/validate_modules.py
    - python ci/validate_profiles.py
    # {} + (no \;): con \; find devuelve 0 aunque shellcheck falle
    - find modules/ -name "*.sh" -exec shellcheck --severity=warning {} +
    - pytest tests/ -v --tb=short
    # El modo test (LOCKD_SYSROOT) no corre como root: arriba se saltean los
    # tests que lo usan y acá corren con un usuario sin privilegios.
    - useradd --create-home lockd-ci
    - chown -R lockd-ci:lockd-ci "$CI_PROJECT_DIR"
    - setpriv --reuid=lockd-ci --regid=lockd-ci --init-groups env HOME=/home/lockd-ci python -m pytest tests/ -v --tb=short
  artifacts:
    when: on_failure
    paths:
      - "*.log"
    expire_in: 7 days

test:python311:
  <<: *test_template
  image: python:3.11-slim
  variables:
    PYTHON_VERSION: "3.11"

test:python312:
  <<: *test_template
  image: python:3.12-slim
  variables:
    PYTHON_VERSION: "3.12"

test:python313:
  <<: *test_template
  image: python:3.13-slim
  variables:
    PYTHON_VERSION: "3.13"


# Paquetes .deb (lockd y lockd-gtk). Se reconstruyen solos:
#  - en cada push a main que toque código o empaquetado (o al lanzar el
#    pipeline a mano desde la web), con versión -git<fecha>.<commit>;
#  - en cada tag vX.Y.Z, con la versión de debian/changelog.
# Corre después de lint y test: un cambio que rompa los tests no publica paquete.
#
# Enlaces estables (GitLab conserva los artefactos de la última pipeline
# exitosa de cada rama o tag, sin vencimiento):
#   <proyecto>/-/jobs/artifacts/main/raw/debs/lockd_latest_all.deb?job=build%3Adeb
#   <proyecto>/-/jobs/artifacts/main/raw/debs/lockd-gtk_latest_all.deb?job=build%3Adeb
build:deb:
  stage: build
  image: debian:trixie-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        DEB_SNAPSHOT: "false"
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      variables:
        DEB_SNAPSHOT: "true"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - lockd.py
        - lockd/**/*
        - modules/**/*
        - profiles/**/*
        - helper/**/*
        - packaging/**/*
        - assets/**/*
        - debian/**/*
        - pyproject.toml
        - ci/build_deb.sh
      variables:
        DEB_SNAPSHOT: "true"
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential
        debhelper dh-python pybuild-plugin-pyproject
        python3-all python3-setuptools python3-yaml dpkg-dev lintian git
    - rm -rf "$CI_PROJECT_DIR/.pip-cache"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash ci/build_deb.sh
  artifacts:
    name: "lockd-$CI_COMMIT_REF_SLUG"
    paths:
      - debs/
    reports:
      dotenv: build.env
    expire_in: 90 days

# Release de GitLab con los .deb de cada tag, enlazados desde los artefactos
# del tag (URL fija por versión).
release:tag:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build:deb
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - echo "Publicando release $CI_COMMIT_TAG (paquetes $DEB_VERSION)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Lockd $CI_COMMIT_TAG"
    description: "Paquetes .deb de Lockd $CI_COMMIT_TAG para Debian, Ubuntu y Parrot OS. Verificación con SHA256SUMS. Cambios en CHANGELOG.md."
    assets:
      links:
        - name: "lockd_${DEB_VERSION}_all.deb (núcleo, CLI y TUI)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/debs/lockd_${DEB_VERSION}_all.deb?job=build%3Adeb"
        - name: "lockd-gtk_${DEB_VERSION}_all.deb (interfaz gráfica)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/debs/lockd-gtk_${DEB_VERSION}_all.deb?job=build%3Adeb"
        - name: "SHA256SUMS"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/debs/SHA256SUMS?job=build%3Adeb"
