[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lockd"
version = "1.0.2"
description = "Herramienta modular de hardening para sistemas Linux"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ricardo Emmanuel Borda", email = "ricardo@lockd.dev" }
]
keywords = ["security", "hardening", "linux", "audit", "clamav"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

requires-python = ">=3.11"

# ── Dependencias pip puras ────────────────────────────────────────────────────
# GTK4, libadwaita, Polkit y ClamAV son paquetes del sistema (apt/dnf).
# Ver README.md → "Requisitos del sistema" para el comando de instalación.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# ── Dependencias del sistema (referencia — no las instala pip) ────────────────
# Requeridas (GUI):
#   python3-gi  gir1.2-gtk-4.0  gir1.2-adw-1
#   libpolkit-gobject-1-0  policykit-1
#
# Recomendadas (módulos de red/servicio):
#   ufw  fail2ban
#
# Opcionales (módulos antivirus):
#   clamav  clamav-daemon  clamav-freshclam
#
# Instalación de ClamAV:
#   sudo apt install clamav clamav-daemon clamav-freshclam
#   sudo systemctl enable --now clamav-daemon clamav-freshclam
#   sudo freshclam   # actualizar firmas la primera vez

[project.urls]
Homepage   = "https://gitlab.com/Ricardo23B/Lockd"
Repository = "https://gitlab.com/Ricardo23B/Lockd"
Issues     = "https://gitlab.com/Ricardo23B/Lockd/-/issues"
Changelog  = "https://gitlab.com/Ricardo23B/Lockd/-/blob/main/CHANGELOG.md"

[project.scripts]
lockd = "lockd.entry:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["lockd*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files   = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
